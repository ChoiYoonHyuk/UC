[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harm-budgeted-updates"
version = "0.1.0"
description = "Core code for Harm-Budgeted Probability Updates for Deployed Risk Models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
gnn = ["torch>=2.1"]

[project.scripts]
harm-budget-evaluate = "harm_budgeted_updates.frozen:main"
harm-budget-summarize = "harm_budgeted_updates.summarize:main"

[tool.setuptools.packages.find]
where = ["src"]
